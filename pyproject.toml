[project]
name = "timetracker"
version = "1.8.1"
description = "A simple time tracker."
authors = [{ name = "Lukáš Kucharczyk", email = "lukas@kucharczyk.xyz" }]
requires-python = ">=3.14,<4"
readme = "README.md"
license = "AGPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "django>6.0",
    "gunicorn>=23.0.0,<24",
    "uvicorn>=0.30.1,<0.31",
    "django-template-partials>=24.2,<25",
    "markdown>=3.6,<4",
    "django-q2>=1.7.4,<2",
    "croniter>=5.0.1,<6",
    "requests>=2.32.3,<3",
    "pyyaml>=6.0.2,<7",
    "django-ninja>=1.6.2",
    "pydantic>=2.13.4,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
timetracker-import = "common.import_data:import_from_file"

[dependency-groups]
dev = [
    "mypy>=1.10.1,<2",
    "pyyaml>=6.0.1,<7",
    "pytest>=9.0.3,<10",
    "django-extensions>=3.2.3,<4",
    "djhtml>=3.0.6,<4",
    "djlint>=1.34.1,<2",
    "isort>=5.13.2,<6",
    "pre-commit>=3.7.1,<4",
    "django-debug-toolbar>=7.1,<8",
    "ruff>=0.16.0,<0.17",
    "pytest-django>=4.12.0",
    "pytest-playwright>=0.8.0",
    "pytest-xdist>=3.6.1,<4",
    "django-stubs[compatible-mypy]>=6.0.5",
]

[tool.uv]

[tool.uv.build-backend]
module-name = ["timetracker"]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
[tool.ruff]
extend-exclude = [
    # Generated by `manage.py gen_icons` (guarded by `make check-icons`); its
    # formatting is the codegen's, not ruff's — linting it would fight --check.
    "common/components/icons_generated.py",
]

[tool.ruff.lint.per-file-ignores]
# Migrations are `makemigrations` output: their `dependencies`/`operations`
# lists are the generator's idiom, and hand-annotating ClassVar there would
# fight every future regeneration.
"games/migrations/*" = ["RUF012"]
# Deliberate naive fixtures; per file, never blanket.
"tests/test_date_time_presentation.py" = ["DTZ001"]
"tests/test_middleware_integration.py" = ["DTZ001"]
"tests/test_stats.py" = ["DTZ001"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "timetracker.settings"

[[tool.mypy.overrides]]
module = ["django_q.*"]
ignore_missing_imports = true

[tool.isort]
 profile = "black"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "timetracker.settings"
addopts = "-p timetracker.pytest_topology"
# Both suites import tests/ helpers by name.
pythonpath = ["tests"]
python_files = ["test_*.py"]
# Naive instants save in TIME_ZONE, not the calendar.
filterwarnings = [
    "error:DateTimeField .* received a naive datetime:RuntimeWarning",
]
markers = [
    "untracked_games: do not auto-create a PlayerGame row for a game this test creates. For the modules that exercise TrackGame or a rebuild, where a pre-existing row is the bug.",
    "draws_unknown_icon: the test draws an icon no snippet names on purpose, so the unknown-icon warning does not fail it.",
]

[project]
name = "timetracker"
version = "1.8.1"
description = "A simple time tracker."
authors = [{ name = "Lukáš Kucharczyk", email = "lukas@kucharczyk.xyz" }]
requires-python = ">=3.14,<4"
readme = "README.md"
license = "AGPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "django>6.0",
    "gunicorn>=23.0.0,<24",
    "uvicorn>=0.30.1,<0.31",
    "django-htmx>=1.18.0,<2",
    "django-template-partials>=24.2,<25",
    "markdown>=3.6,<4",
    "django-q2>=1.7.4,<2",
    "croniter>=5.0.1,<6",
    "requests>=2.32.3,<3",
    "pyyaml>=6.0.2,<7",
    "django-ninja>=1.6.2",
    "pydantic>=2.13.4,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
timetracker-import = "common.import_data:import_from_file"

[dependency-groups]
dev = [
    "mypy>=1.10.1,<2",
    "pyyaml>=6.0.1,<7",
    "pytest>=9.0.3,<10",
    "django-extensions>=3.2.3,<4",
    "djhtml>=3.0.6,<4",
    "djlint>=1.34.1,<2",
    "isort>=5.13.2,<6",
    "pre-commit>=3.7.1,<4",
    "django-debug-toolbar>=7.1,<8",
    "ruff>=0.16.0,<0.17",
    "pytest-django>=4.12.0",
    "pytest-playwright>=0.8.0",
    "pytest-xdist>=3.6.1,<4",
    "django-stubs[compatible-mypy]>=6.0.5",
]

[tool.uv]

[tool.uv.build-backend]
module-name = ["timetracker"]
module-root = ""

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
[tool.ruff]
extend-exclude = [
    # TODO: remove this exclusion once the streak feature is actually
    # implemented. streak_bruteforce.py is a throwaway exploration script
    # (it runs django.setup() before importing models, which trips E402);
    # it's excluded for now rather than contorted to satisfy the linter.
    "streak_bruteforce.py",
    # Generated by `manage.py gen_icons` (guarded by `make check-icons`); its
    # formatting is the codegen's, not ruff's — linting it would fight --check.
    "common/components/icons_generated.py",
]

[tool.ruff.lint.per-file-ignores]
# Migrations are `makemigrations` output: their `dependencies`/`operations`
# lists are the generator's idiom, and hand-annotating ClassVar there would
# fight every future regeneration.
"games/migrations/*" = ["RUF012"]
# These specific tests construct naive datetimes/dates as deliberate fixture
# values (the code under test owns the tz semantics); the e2e one additionally
# compares against the browser's local "today". Deliberately file-specific: a
# blanket tests/e2e ignore would also silence genuine DTZ mistakes in new tests.
"tests/test_date_time_presentation.py" = ["DTZ001"]
"tests/test_middleware_integration.py" = ["DTZ001"]
"tests/test_stats.py" = ["DTZ001"]
"e2e/test_date_range_picker_e2e.py" = ["DTZ011"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "timetracker.settings"

[[tool.mypy.overrides]]
module = ["django_q.*", "django_htmx.*"]
ignore_missing_imports = true

[tool.isort]
 profile = "black"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "timetracker.settings"
addopts = "-p timetracker.pytest_topology"
python_files = ["test_*.py"]
markers = [
    "untracked_games: do not auto-create a PlayerGame row for a game this test creates. For the modules that exercise TrackGame, the backfill or a rebuild, where a pre-existing row is the bug.",
]

# Builds the image on every push and publishes it from main. The checks run
# locally (`make check`) and on GitHub; this workflow only builds.
name: Build image

on:
  push:
    branches: ['**']
    paths-ignore: [ 'README.md' ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            registry.kucharczyk.xyz/timetracker:latest
            registry.kucharczyk.xyz/timetracker:main-${{ env.SHORT_SHA }}
          build-args: |
            VERSION_NUMBER=main-${{ env.SHORT_SHA }}

---
services:
  timetracker:
    image: ${REGISTRY_URL:-registry.kucharczyk.xyz}/timetracker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timetracker
    environment:
      - DEBUG=${DEBUG:-false}
      - SECRET_KEY=${SECRET_KEY}
      - TZ=${TZ:-Europe/Prague}
      # APP_URL drives ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS unless overridden.
      - APP_URL=${APP_URL:-http://localhost:8000}
      - CREATE_DEFAULT_SUPERUSER=${CREATE_DEFAULT_SUPERUSER:-false}
      - DATABASE_URL__FILE=/run/secrets/timetracker_database_url
    ports:
      - "${TIMETRACKER_EXTERNAL_PORT:-8000}:8000"
    volumes:
      - "${DOCKER_STORAGE_PATH:-/tmp}/timetracker/backups:/home/timetracker/app/games/fixtures/backups"
    secrets:
      - source: timetracker_database_url
        target: timetracker_database_url
        mode: 0400
    restart: unless-stopped

secrets:
  timetracker_database_url:
    file: ${TIMETRACKER_DATABASE_URL_FILE:?set TIMETRACKER_DATABASE_URL_FILE}

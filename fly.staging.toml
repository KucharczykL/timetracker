# Shared Fly.io configuration for ephemeral, per-branch GitHub staging deploys.
#
# The app name is NOT set here on purpose; each branch supplies its own via
# `flyctl deploy --app timetracker-staging-<slug>`. These instances run with a
# fresh database seeded from sample fixtures (never production data) and their
# own SECRET_KEY, so they are safe to expose on a public *.fly.dev hostname.

primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  DEBUG = "false"
  TZ = "Europe/Prague"
  DATA_DIR = "/home/timetracker/app/data"
  LOAD_SAMPLE_DATA = "true"
  CREATE_DEFAULT_SUPERUSER = "true"
  DEV_LOGIN_PREFILL = "admin:admin"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  # Without a check the proxy routes into a machine the moment it is "started",
  # i.e. while the entrypoint is still migrating and seeding, and answers the
  # resulting refusals with 502s.
  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    timeout = "10s"
    method = "GET"
    path = "/health/ready"

[[vm]]
  size = "shared-cpu-1x"
  # 512mb does not fit caddy + gunicorn + the django-q cluster (which forks a
  # guard, monitor, pusher and worker, ~260mb between them): the machine ran at
  # MemAvailable ~7mb, evicting its own page cache, and every request faulted
  # code back off disk until the worker timed out.
  memory = "1024mb"

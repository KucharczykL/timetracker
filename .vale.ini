StylesPath = .vale/styles

# No `Packages =`. Every rule this repo enforces lives in .vale/styles, so a
# lint needs no network and cannot pick up a different version of a rule than
# the one in the tree.
MinAlertLevel = warning

# Prose: the docs and the two instruction files. Code fences, inline code and
# headings are skipped by each rule's scope, so a banned word is caught in a
# sentence and left alone in an identifier.
[*.md]
BasedOnStyles = Timetracker

# A design record says which words the codebase gave up and why, so it has to
# be able to name them, and a changelog entry describes a release that already
# shipped under the word it used. Only the rules added after those files were
# written are lifted: both paths are history, and everything else they say is
# held to the same standard.
[{CHANGELOG.md,docs/superpowers/**/*.md}]
BasedOnStyles = Timetracker
Timetracker.Removal = NO
Timetracker.RemovalTerms = NO
Timetracker.Heal = NO
Timetracker.HealTerms = NO

# Comments only. Vale extracts them; the code around them is never read, so an
# identifier that contains a refused word does not trip a rule.
[*.{py,ts}]
BasedOnStyles = Timetracker

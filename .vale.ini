StylesPath = .vale/styles

# No `Packages =`. Every rule this repo enforces lives in .vale/styles, so a
# lint needs no network and cannot pick up a different version of a rule than
# the one in the tree.
MinAlertLevel = warning

# Prose: the docs and the two instruction files. Code fences, inline code and
# headings are skipped by each rule's scope, so a banned word is caught in a
# sentence and left alone in an identifier.
[*.md]
BasedOnStyles = Timetracker

# A changelog entry describes a release that already shipped under the word it
# used, and rewriting it would date the entry to the day the word changed.
# Only the rules added after the entries were written are lifted; everything
# else the file says is held to the same standard.
#
# Design records under docs/superpowers/ were lifted the same way and are not
# any more. A run reads the files a checkout changed, so an old record answers
# for its words when it is next amended, and a record that names a word the
# codebase gave up writes it as code, which every rule skips.
[CHANGELOG.md]
BasedOnStyles = Timetracker
Timetracker.Removal = NO
Timetracker.RemovalTerms = NO
Timetracker.Heal = NO
Timetracker.HealTerms = NO
Timetracker.Seam = NO
Timetracker.Leg = NO

# Comments only. Vale extracts them; the code around them is never read, so an
# identifier that contains a refused word does not trip a rule.
[*.{py,ts}]
BasedOnStyles = Timetracker

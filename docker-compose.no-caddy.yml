---
services:
  timetracker:
    image: registry.kucharczyk.xyz/timetracker
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timetracker
    environment:
      - DEBUG=false
      - TZ=Europe/Prague
      # APP_URL drives ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS unless overridden.
      # Behind your own reverse proxy you may also set ALLOWED_HOSTS=* directly.
      - APP_URL=https://tracker.kucharczyk.xyz
      - DATABASE_URL__FILE=/run/secrets/timetracker_database_url
    user: "1000"
    # volumes:
    secrets:
      - source: timetracker_database_url
        target: timetracker_database_url
        mode: 0400
    ports:
      - "8000:8000"
    restart: unless-stopped

secrets:
  timetracker_database_url:
    file: ${TIMETRACKER_DATABASE_URL_FILE:?set TIMETRACKER_DATABASE_URL_FILE}

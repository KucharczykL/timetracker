name: Django CI/CD

on:
  push:
    paths-ignore: [ 'README.md' ]
  # allow manual reruns from the Actions tab (an empty retrigger commit
  # matches no paths, so the push trigger skips it)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://timetracker:timetracker@127.0.0.1:5432/timetracker
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: timetracker
          POSTGRES_USER: timetracker
          POSTGRES_PASSWORD: timetracker
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8 --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install pnpm and JS dependencies
        run: npm install --global pnpm@10.33.0 && pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run checks
        run: make check

      - name: Verify PostgreSQL backup restore
        run: |
          set -euo pipefail
          postgres_id="$(docker ps --filter 'ancestor=postgres:18.4' --format '{{.ID}}' | head -n 1)"
          test -n "$postgres_id"
          verification_database=timetracker_restore_verify
          dump_file=/tmp/timetracker.dump
          docker exec "$postgres_id" pg_dump -U timetracker --format=custom --no-owner --no-privileges --file="$dump_file" timetracker
          docker exec "$postgres_id" createdb -U timetracker "$verification_database"
          docker exec "$postgres_id" pg_restore -U timetracker --exit-on-error --no-owner --no-privileges --dbname="$verification_database" "$dump_file"
          DATABASE_URL="postgresql://timetracker:timetracker@127.0.0.1:5432/$verification_database" uv run --frozen python manage.py migrate --check
          docker exec "$postgres_id" dropdb -U timetracker "$verification_database"

      - name: Smoke test database URL secret
        run: |
          secret_file="$(mktemp)"
          trap 'rm -f "$secret_file"' EXIT
          printf '%s\n' 'postgresql://timetracker@example.invalid/timetracker' > "$secret_file"
          chmod 0444 "$secret_file"
          docker build --tag timetracker:secret-smoke .
          docker run --rm --user 1000:1000 \
            --entrypoint python \
            -e DATABASE_URL__FILE=/run/secrets/timetracker_database_url \
            --mount type=bind,src="$secret_file",dst=/run/secrets/timetracker_database_url,readonly \
            timetracker:secret-smoke \
            -c 'from timetracker.database import required_database_settings; assert required_database_settings()["HOST"] == "example.invalid"'

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            registry.kucharczyk.xyz/timetracker:latest
            registry.kucharczyk.xyz/timetracker:main-${{ env.SHORT_SHA }}
          build-args: |
            VERSION_NUMBER=main-${{ env.SHORT_SHA }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

name: Django CI/CD

on:
  push:
    paths-ignore: [ 'README.md' ]
  # allow manual reruns from the Actions tab (an empty retrigger commit
  # matches no paths, so the push trigger skips it)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://timetracker:timetracker@127.0.0.1:5432/timetracker
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: timetracker
          POSTGRES_USER: timetracker
          POSTGRES_PASSWORD: timetracker
          POSTGRES_INITDB_ARGS: --locale-provider=builtin --builtin-locale=C.UTF-8 --encoding=UTF8
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install pnpm and JS dependencies
        run: npm install --global pnpm@10.33.0 && pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run checks
        run: make check

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Compute short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            registry.kucharczyk.xyz/timetracker:latest
            registry.kucharczyk.xyz/timetracker:main-${{ env.SHORT_SHA }}
          build-args: |
            VERSION_NUMBER=main-${{ env.SHORT_SHA }}
          # cache-from: type=gha
          # cache-to: type=gha,mode=max

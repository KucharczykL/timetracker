name: Release image

# Tag filter lives in its own workflow: adding tags: to a push trigger
# without a branches: filter disables branch runs for that workflow.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      # Fonts, icons and the sample fixture are LFS objects: without this the
      # image ships their pointer files and every webfont fails to load.
      - uses: actions/checkout@v4
        with:
          lfs: true

      # The tag is the version's source of truth for the image; pyproject
      # must agree so the packaged metadata isn't lying.
      - name: Verify tag matches pyproject version
        run: |
          PYPROJECT_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v${PYPROJECT_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version ${PYPROJECT_VERSION}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Rebuild rather than retag: the main build baked main-<sha> as the
      # displayed version before the tag existed.
      - name: Build and push release image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: registry.kucharczyk.xyz/timetracker:${{ github.ref_name }}
          build-args: |
            VERSION_NUMBER=${{ github.ref_name }}
